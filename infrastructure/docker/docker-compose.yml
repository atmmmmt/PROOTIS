services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

  api:
    build:
      context: ../..
      dockerfile: infrastructure/docker/api.Dockerfile
    env_file:
      - ../../.env
    ports:
      - "4000:4000"
    depends_on:
      - mongo
      - redis

  web:
    build:
      context: ../..
      dockerfile: infrastructure/docker/web.Dockerfile
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  mongo-data:
